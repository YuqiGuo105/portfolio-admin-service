name: Deploy monitoring scraper

on:
  push:
    branches: [main]
    paths:
      - "monitoring/**"
      - ".github/workflows/deploy-monitoring.yml"
      - ".github/workflows/monitoring-watchdog.yml"
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - 'monitoring/**'
      - '.github/workflows/deploy-monitoring.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-portfolio-monitoring
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'portfolio-notify-prod' }}
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  validate:
    name: Validate Alloy image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and generate service registry
        run: |
          npm ci --prefix monitoring --ignore-scripts --no-audit --no-fund
          npm test --prefix monitoring
          npm run generate --prefix monitoring

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build monitoring image
        uses: docker/build-push-action@v6
        with:
          context: monitoring/alloy
          file: monitoring/alloy/Dockerfile
          push: false
          tags: portfolio-metrics-scraper:validation
          cache-from: type=gha,scope=monitoring
          cache-to: type=gha,mode=max,scope=monitoring

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Deploy Alloy on e2-micro
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate service configuration
        run: |
          npm ci --prefix monitoring --ignore-scripts --no-audit --no-fund
          npm run generate --prefix monitoring

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify existing private metrics access (read only)
        run: node monitoring/verify-access.mjs

      - name: Configure Container Registry
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and publish scraper image
        run: |
          SHA_IMAGE="gcr.io/${GCP_PROJECT_ID}/portfolio-metrics-scraper:sha-$(echo "${DEPLOY_SHA}" | cut -c1-7)"
          LATEST_IMAGE="gcr.io/${GCP_PROJECT_ID}/portfolio-metrics-scraper:latest"
          docker build -f monitoring/alloy/Dockerfile \
            -t "${SHA_IMAGE}" \
            -t "${LATEST_IMAGE}" \
            monitoring/alloy
          docker push "${SHA_IMAGE}"
          docker push "${LATEST_IMAGE}"

      - name: Verify collector is running this registry revision
        env:
          GRAFANA_RENDER_TOKEN: ${{ secrets.GRAFANA_RENDER_TOKEN }}
        run: node monitoring/verify-deployment.mjs

      - name: Reconcile registry-managed Grafana panels
        env:
          GRAFANA_RENDER_TOKEN: ${{ secrets.GRAFANA_RENDER_TOKEN }}
          GRAFANA_DASHBOARD_BACKUP: ${{ runner.temp }}/grafana-before.json
        run: node monitoring/sync-dashboard.mjs --apply

      - name: Verify production metrics after self-update
        run: |
          EXPECTED="$(jq 'length' monitoring/public-catalog.json)"
          for attempt in $(seq 1 24); do
            PAYLOAD="$(curl --fail --silent --show-error --max-time 30 \
              "https://www.yuqi.site/api/metrics" || true)"
            if echo "${PAYLOAD}" | jq -e --argjson expected "${EXPECTED}" \
              '.summary.total == $expected and .summary.down == 0 and .summary.unknown == 0 and .stale != true' >/dev/null 2>&1; then
              echo "${PAYLOAD}" | jq '{updatedAt, summary}'
              exit 0
            fi
            echo "Attempt ${attempt}: waiting for the scraper self-update."
            sleep 30
          done
          echo "Production metrics did not recover after the scraper image update."
          exit 1
