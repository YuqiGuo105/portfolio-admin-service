name: Monitoring watchdog

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: portfolio-monitoring-watchdog
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Verify platform metrics
        run: |
          for attempt in $(seq 1 10); do
            PAYLOAD="$(curl --fail --silent --show-error --max-time 30 \
              "https://www.yuqi.site/api/metrics" || true)"
            if echo "${PAYLOAD}" | jq -e \
              '.summary.total >= 9 and .summary.down == 0' >/dev/null 2>&1; then
              echo "${PAYLOAD}" | jq '{updatedAt, summary}'
              exit 0
            fi
            echo "Attempt ${attempt}: waiting for complete platform metrics."
            sleep 30
          done
          echo "Platform metrics remained incomplete after recovery window."
          exit 1

      - name: Verify public MCP edge
        run: |
          URL="${{ vars.PUBLIC_MCP_URL || 'https://portfolio-mcp-server-702193211434.us-central1.run.app' }}"
          curl --fail --silent --show-error --retry 4 --retry-delay 5 \
            --max-time 30 "${URL}/health" |
            jq -e '.ok == true or ((.status // "") | ascii_downcase) == "ok"'
