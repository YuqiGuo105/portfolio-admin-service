version: 1
services:
  - id: portfolio-admin-service
    name: Admin
    monitoring: jvm
    endpoint: https://portfolio-admin-service-702193211434.us-central1.run.app/actuator/prometheus
    intervalSeconds: 60
    public: true
    repo: portfolio-admin-service
    module: admin-service
    purpose: Content management, publishing, and protected operational APIs.
    stack: [Spring Boot, PostgreSQL, Kafka]
  - id: portfolio-notification-service
    name: Notification
    monitoring: jvm
    endpoint: https://portfolio-notification-service-702193211434.us-central1.run.app/actuator/prometheus
    intervalSeconds: 60
    public: true
    repo: portfolio-notification-service
    purpose: Subscription preferences and reliable delivery of content updates.
    stack: [Spring Boot, PostgreSQL, Email]
  - id: portfolio-agent-service
    name: AI Agent
    monitoring: jvm
    endpoint: https://portfolio-agent-service-702193211434.us-central1.run.app/actuator/prometheus
    intervalSeconds: 60
    public: true
    repo: portfolio-ai-platform
    module: portfolio-agent-service
    purpose: Plans requests, retrieves evidence, runs tools, and streams Mr. Pot's answers.
    stack: [Spring Boot, SSE, Valkey]
  - id: portfolio-mcp-gateway
    name: MCP Gateway
    monitoring: jvm
    endpoint: https://portfolio-mcp-gateway-702193211434.us-central1.run.app/actuator/prometheus
    intervalSeconds: 60
    public: true
    repo: portfolio-ai-platform
    module: portfolio-mcp-gateway
    purpose: Typed tool execution with role checks, confirmation, and audit records.
    stack: [Spring Boot, MCP, RBAC]
  - id: knowledge-service
    name: Knowledge
    monitoring: jvm
    endpoint: https://knowledge-service-702193211434.us-central1.run.app/actuator/prometheus
    intervalSeconds: 60
    public: true
    repo: portfolio-ai-platform
    module: knowledge-service
    purpose: Permission-aware retrieval that combines lexical and vector evidence.
    stack: [Spring Boot, OpenSearch, pgvector]
  - id: portfolio-search-indexer
    name: Search Indexer
    monitoring: jvm
    endpoint: https://portfolio-search-indexer-702193211434.us-central1.run.app/actuator/prometheus
    access: cloud-run-iam
    intervalSeconds: 60
    public: true
    repo: portfolio-admin-service
    module: search-indexer
    purpose: Projects content changes into searchable OpenSearch documents.
    stack: [Spring Boot, Kafka, OpenSearch]
  - id: portfolio-rag-indexer
    name: RAG Indexer
    monitoring: jvm
    endpoint: https://portfolio-rag-indexer-702193211434.us-central1.run.app/actuator/prometheus
    access: cloud-run-iam
    intervalSeconds: 60
    public: true
    repo: portfolio-admin-service
    module: rag-indexer
    purpose: Chunks content and maintains embeddings for retrieval.
    stack: [Spring Boot, Kafka, pgvector]
  - id: analytics-aggregator-service
    name: Analytics Aggregator
    monitoring: jvm
    endpoint: https://portfolio-analytics-aggregator-702193211434.us-central1.run.app/actuator/prometheus
    intervalSeconds: 60
    public: true
    repo: portfolio-analytics-platform
    module: analytics-aggregator-service
    purpose: Deduplicates visitor events and builds session and geographic rollups.
    stack: [Spring Boot, Kafka, Valkey]
  - id: analytics-alerts-service
    name: Analytics Alerts
    monitoring: jvm
    endpoint: https://portfolio-analytics-alerts-702193211434.us-central1.run.app/actuator/prometheus
    intervalSeconds: 60
    public: true
    repo: portfolio-analytics-platform
    module: analytics-alerts-service
    purpose: Evaluates visitor analytics rules and prepares operational alerts.
    stack: [Spring Boot, PostgreSQL, Alerts]
  - id: portfolio-application-copilot
    name: Career Workflow Service
    monitoring: jvm
    endpoint: https://portfolio-application-copilot-y45c2mnbja-uc.a.run.app/actuator/prometheus
    access: cloud-run-iam
    intervalSeconds: 60
    public: true
    repo: portfolio-application-copilot
    purpose: Private application workflows with owner-reviewed actions.
    stack: [Spring Boot, PostgreSQL, Valkey]
  - id: portfolio-media-service
    name: Media Service
    monitoring: jvm
    endpoint: https://portfolio-media-service-y45c2mnbja-uc.a.run.app/actuator/prometheus
    access: cloud-run-iam
    intervalSeconds: 120
    public: true
    repo: portfolio-admin-service
    module: media-service
    purpose: Private uploads, background transcoding, and published video renditions.
    stack: [Spring Boot, FFmpeg, Cloud Storage]
  - id: portfolio-voice-relay
    name: Voice Relay
    monitoring: health
    endpoint: https://portfolio-voice-relay-y45c2mnbja-uc.a.run.app/health
    intervalSeconds: 120
    public: true
    healthProfile: ok
    repo: Portfolio
    module: services/voice
    purpose: Relays real-time voice sessions and applies shared usage limits.
    stack: [Node.js, WebSocket, Voice]
  - id: portfolio-mcp-server
    name: MCP Server
    monitoring: health
    endpoint: https://portfolio-mcp-server-y45c2mnbja-uc.a.run.app/health
    intervalSeconds: 120
    public: true
    healthProfile: mcp
    repo: portfolio-mcp-server
    purpose: Public portfolio tools and authenticated administrator MCP access.
    stack: [Node.js, MCP, OAuth]
